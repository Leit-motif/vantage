name: CI

# Restores, builds, tests, and proves the shipping configuration publishes.
# It deliberately does not create a release: v1 ships as a personal build.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vantage.slnx

      - name: Build
        run: dotnet build Vantage.slnx --configuration Release --no-restore

      # The portable suite first and on its own, so a Windows dependency reaching the engine is a
      # distinct red step rather than something buried in a run that also drives a WPF shell.
      - name: Test the portable engine
        run: dotnet test tests/Vantage.Tests/Vantage.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=engine.trx"

      - name: Test the Windows shell
        run: dotnet test tests/Vantage.Tests.Shell/Vantage.Tests.Shell.csproj --configuration Release --no-build --logger "trx;LogFileName=shell.trx"

      - name: Validate the shipping publish configuration
        run: dotnet publish src/Vantage.App/Vantage.App.csproj -p:PublishProfile=win-x64 --configuration Release --output ${{ runner.temp }}/publish

      - name: Confirm the published artifact exists
        shell: pwsh
        run: |
          $exe = Join-Path "${{ runner.temp }}/publish" "Vantage.exe"
          if (-not (Test-Path $exe)) { throw "Publish did not produce $exe" }
          "Published $((Get-Item $exe).Length) bytes"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
