name: CI

# Restores, builds, tests, and proves the shipping configuration publishes.
# It deliberately does not create a release: v1 ships as a personal build.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MattWorkflowDashboard.slnx

      - name: Build
        run: dotnet build MattWorkflowDashboard.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/MattWorkflowDashboard.Tests/MattWorkflowDashboard.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Validate the shipping publish configuration
        run: dotnet publish src/MattWorkflowDashboard.App/MattWorkflowDashboard.App.csproj -p:PublishProfile=win-x64 --configuration Release --output ${{ runner.temp }}/publish

      - name: Confirm the published artifact exists
        shell: pwsh
        run: |
          $exe = Join-Path "${{ runner.temp }}/publish" "MattWorkflowDashboard.exe"
          if (-not (Test-Path $exe)) { throw "Publish did not produce $exe" }
          "Published $((Get-Item $exe).Length) bytes"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
